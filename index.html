  #loading-screen {

    gap: 0;

    position: relative; z-index: 1;

  }

    border-radius: 0 4px 4px 0;
    box-shadow: 2px 0 8px rgba(0,0,0,0.45);

    100% { transform: rotate(360deg); }

    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.04); }
  }
  @keyframes loadDotPulse {
    0%,80%,100% { opacity: 0.15; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }
  @keyframes loadSticker1 {
    0%,100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(-8deg) translateY(-8px); }
  }
  @keyframes loadSticker2 {
    0%,100% { transform: rotate(5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-10px); }

  @keyframes loadGlitch {
    0%,90%,100% { clip-path: none; transform: none; color: #fff; }
    92% { clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translateX(-3px); color: #0ff; }
    94% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translateX(3px); color: #f0f; }
    96% { clip-path: none; transform: none; color: #fff; }
  }
  .loading-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: #050505;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }

    animation: loadFadeOut 0.9s cubic-bezier(0.4,0,0.2,1) forwards;

  /* ── MOBILE ───────────────────────────────────── */
  /* Mobile keeps the same decorative elements as desktop (tape, page edge).

  @media (max-width: 700px) {

    #loader-sub { font-size: 11px; margin-top: 10px; }
    #loader-dots { margin-top: 36px; }
  }

        {isEditMode && <button onClick={async () => {
          const pwd = prompt("Admin password:");
          if (!pwd) return;
          const btn = document.activeElement;
          btn.textContent = "Compressing…";
          btn.disabled = true;
          try {
            // Re-compress any image that's still large (uploaded before tighter
            // limits, or pasted as a raw data URL). JPEG only — PNGs may have
            // transparency we must not lose by converting.
            const squeezeImg = (src) => new Promise((res) => {
              if (!src || src.length < 350_000) { res(src); return; }
              const isJpeg = src.startsWith("data:image/jpeg") || src.startsWith("data:image/jpg");
              const isPngSrc = src.startsWith("data:image/png");
              if (!isJpeg && !isPngSrc) { res(src); return; }
              const el = new Image();
              el.onload = () => {
                const MAX = isPngSrc ? 850 : 1000;
                const long = Math.max(el.width, el.height);
                const s = long > MAX ? MAX / long : 1;
                const cv = document.createElement("canvas");
                cv.width = Math.round(el.width * s); cv.height = Math.round(el.height * s);
                cv.getContext("2d").drawImage(el, 0, 0, cv.width, cv.height);
                try {
                  const out = isPngSrc ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.72);
                  res(out.length < src.length ? out : src);
                } catch { res(src); }
              };
              el.onerror = () => res(src);
              el.src = src;
            });
            const squeezePage = async (pg) => ({ ...pg, images: await Promise.all((pg.images||[]).map(async im => ({ ...im, src: await squeezeImg(im.src) }))) });
            btn.textContent = "Publishing…";
            const [sqPages, sqCover, sqIpad] = await Promise.all([
              Promise.all(pages.map(squeezePage)),
              squeezePage(coverPage),
              Promise.all(ipadArt.map(async art => ({ ...art, src: await squeezeImg(art.src) }))),
            ]);
            const state = { pages: sqPages, coverPage: sqCover, ipadArt: sqIpad, background, bgLayout };
            const body = JSON.stringify({ password: pwd, state });
            // Vercel serverless functions cap request bodies around 4.5MB.
            const mb = body.length / (1024 * 1024);
            if (mb > 4.2) {
              alert("Payload too large: " + mb.toFixed(2) + "MB (limit ~4.5MB).\nTry deleting some images from crowded pages, then publish again.");
              btn.textContent = isMobile ? "PUBLISH" : "⬆ PUBLISH";
              btn.disabled = false;
              return;
            }
            const res = await fetch("/api/publish", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body,
            });
            const text = await res.text();
            let json;
            try { json = JSON.parse(text); }
            catch {
              alert("Server error (" + res.status + "): " + text.slice(0, 200));
              btn.textContent = isMobile ? "PUBLISH" : "⬆ PUBLISH";
              btn.disabled = false;
              return;
            }
            if (json.ok) alert("✓ " + json.message);
            else alert("Error: " + json.error);
          } catch(e) { alert("Network error: " + e.message); }
          btn.textContent = isMobile ? "PUBLISH" : "⬆ PUBLISH";
          btn.disabled = false;
        }} style={{

        }}>{isMobile ? "PUBLISH" : "⬆ PUBLISH"}</button>}
